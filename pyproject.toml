[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eda-snacks"
version = "0.1.0"
description = "Exploratory Data Analysis project for snack datasets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "matplotlib>=3.7.0",
  "seaborn>=0.12.0",
  "scikit-learn>=1.3.0",
  "jupyter>=1.0.0",
  "pytest>=7.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
